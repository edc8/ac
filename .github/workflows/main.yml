name: Update APK Data
on:
  schedule:
    - cron: '0 * * * *' # 每小时自动更新一次
  workflow_dispatch:      # 允许手动运行
  release:
    types: [published]    # 当你发布新 Release 时自动运行

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get Latest Release Data
        run: |
          # 抓取最新的 Release 信息并存为 data.json
          curl -s https://api.github.com/repos/${{ github.repository }}/releases/latest > data.json
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "自动更新发布数据" || exit 0
          git push
