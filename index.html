<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>hex 小站 - Matrix Love</title>
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #000; 
            color: #eee; 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            line-height: 1.5; 
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 画布定位 */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        .container { 
            position: relative;
            max-width: 800px; 
            margin: 0 auto; 
            padding: 12px; 
            z-index: 10; /* 确保在画布之上 */
            pointer-events: none; /* 让点击穿透容器，除非点击的是按钮 */
        }

        /* 恢复容器内的点击事件 */
        header, .main-content, a { pointer-events: auto; }

        header { 
            background: rgba(10, 10, 10, 0.85); 
            backdrop-filter: blur(10px);
            padding: 20px; 
            border-radius: 12px 12px 0 0; 
            border: 1px solid rgba(46, 204, 113, 0.3);
            text-align: center; 
        }

        .logo i { font-size: 2rem; color: #2ecc71; margin-bottom: 8px; text-shadow: 0 0 10px #2ecc71; }
        .logo h1 { font-size: 1.5rem; font-weight: 700; color: #2ecc71; margin-bottom: 5px; }
        .site-stats { font-size: 0.75rem; color: #aaa; display: flex; justify-content: center; gap: 15px; }
        .val { color: #e67e22; font-weight: 600; }
        .speed-val { color: #2ecc71; font-weight: 600; }

        .main-content { 
            background: rgba(10, 10, 10, 0.9); 
            backdrop-filter: blur(10px);
            border-radius: 0 0 12px 12px; 
            border: 1px solid rgba(46, 204, 113, 0.3);
            border-top: none;
            overflow: hidden; 
        }

        .list-header { 
            display: grid; 
            grid-template-columns: 40px 1fr 80px 80px 140px; 
            padding: 12px 20px; 
            background-color: rgba(46, 204, 113, 0.1); 
            font-weight: 600; 
            color: #2ecc71; 
            font-size: 0.85rem; 
        }

        .file-item { 
            display: grid; 
            grid-template-columns: 40px 1fr 80px 80px 140px; 
            padding: 15px 20px; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            align-items: center; 
        }

        .file-icon { font-size: 1.2rem; color: #2ecc71; }
        .file-name { color: #fff; text-decoration: none; font-weight: 600; font-size: 0.95rem; }
        .file-size, .file-time { color: #888; font-size: 0.8rem; }
        
        .file-op { display: flex; flex-direction: column; gap: 4px; }
        .btn-download { background: #2ecc71; color: #000 !important; padding: 8px 0; border-radius: 6px; text-align: center; font-size: 0.85rem; font-weight: 600; text-decoration: none; }
        .btn-origin { color: #555; font-size: 0.7rem; text-align: center; text-decoration: none; }
        
        .loading { padding: 60px; text-align: center; color: #2ecc71; }

        /* 爱心特效样式 */
        .heart {
            position: fixed;
            pointer-events: none;
            user-select: none;
            z-index: 9999;
            animation: heart-float 1.2s ease-out forwards;
        }
        @keyframes heart-float {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -150%) scale(1.5); }
        }

        @media (max-width: 600px) {
            .list-header { display: none; }
            .file-item { grid-template-columns: 40px 1fr 100px; padding: 15px; }
            .hide-mob { display: none; }
            .mobile-info { font-size: 0.75rem; color: #777; margin-top: 3px; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fab fa-android"></i>
                <h1>hex 小站</h1>
                <div class="site-stats">
                    <div class="stat-item">已运行: <span id="runtime" class="val">-</span></div>
                    <div class="stat-item">响应: <span id="speed" class="speed-val">-</span></div>
                </div>
            </div>
        </header>
        <div class="main-content">
            <div class="file-list">
                <div id="file-container">
                    <div class="loading"><i class="fas fa-circle-notch fa-spin"></i> 系统初始化中...</div>
                </div>
            </div>
        </div>
    </div>

<script>
/* --- Matrix Background --- */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
const letters = "0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const fontSize = 16;
const columns = Math.floor(width / fontSize);
const drops = Array(columns).fill(1);

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)";
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = "#0F0";
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 35);
window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

/* --- Click Heart Effect --- */
window.addEventListener('click', (e) => {
    createHeart(e.clientX, e.clientY);
});

function createHeart(x, y) {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '<i class="fas fa-heart"></i>';
    // 随机颜色 (红、粉、浅绿)
    const colors = ['#e74c3c', '#ff69b4', '#2ecc71', '#f1c40f'];
    heart.style.color = colors[Math.floor(Math.random() * colors.length)];
    heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
    heart.style.left = x + 'px';
    heart.style.top = y + 'px';
    document.body.appendChild(heart);
    
    // 动画结束后移除元素
    setTimeout(() => { heart.remove(); }, 1200);
}

/* --- Original Data Logic --- */
const startMark = performance.now();
const CONFIG = {
    proxy: 'https://ghproxy.net/',
    createDate: '2025-01-23T00:00:00'
};

function showRuntime() {
    const diff = new Date().getTime() - new Date(CONFIG.createDate).getTime();
    if(diff < 0) return;
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('runtime').innerText = `${d}天${h}时${m}分${s}秒`;
}
setInterval(showRuntime, 1000);

async function loadData() {
    const container = document.getElementById('file-container');
    try {
        const res = await fetch(`./data.json?v=${Date.now()}`);
        const data = await res.json();
        const release = Array.isArray(data) ? data[0] : data;
        let assets = release.assets || [];

        if (assets.length === 0) {
            container.innerHTML = '<div class="loading">暂无文件</div>';
            return;
        }

        assets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        container.innerHTML = `
            <div class="list-header">
                <div></div><div>文件名</div><div class="hide-mob">大小</div><div class="hide-mob">发布日期</div><div>下载</div>
            </div>`;
        
        assets.forEach(asset => {
            const size = (asset.size / 1048576).toFixed(1) + 'MB';
            const date = asset.updated_at.substring(5, 10);
            const fastUrl = CONFIG.proxy + asset.browser_download_url;

            container.insertAdjacentHTML('beforeend', `
                <div class="file-item">
                    <div class="file-icon"><i class="fab fa-android"></i></div>
                    <div>
                        <a href="${fastUrl}" class="file-name">${asset.name}</a>
                        <div class="mobile-info hide-pc">${size} | ${date}</div>
                    </div>
                    <div class="file-size hide-mob">${size}</div>
                    <div class="file-time hide-mob">${date}</div>
                    <div class="file-op">
                        <a href="${fastUrl}" class="btn-download">极速下载</a>
                        <a href="${asset.browser_download_url}" class="btn-origin" target="_blank">备用原链</a>
                    </div>
                </div>`);
        });

        document.getElementById('speed').innerText = (performance.now() - startMark).toFixed(0) + 'ms';
    } catch (e) {
        container.innerHTML = '<div class="loading" style="color:#e74c3c;">数据加载失败</div>';
    }
}
loadData();
</script>
</body>
</html>
