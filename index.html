<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>hex 小站</title>
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #000; 
            color: #2ecc71; 
            font-family: "Consolas", "Courier New", monospace; 
            line-height: 1.5; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        #matrix-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -1;
            opacity: 0.8;
        }

        .container { 
            position: relative;
            max-width: 900px; 
            margin: 0 auto; 
            padding: 40px 10px; 
            z-index: 10;
        }

        header { margin-bottom: 30px; }
        .logo i { font-size: 2.2rem; color: #2ecc71; text-shadow: 0 0 15px #2ecc71; }
        .logo h1 { font-size: 1.6rem; font-weight: 700; color: #fff; margin: 8px 0; text-shadow: 0 0 10px #2ecc71; }
        
        .site-stats { 
            font-size: 0.75rem; 
            color: rgba(46, 204, 113, 0.7); 
            display: flex; 
            gap: 15px; 
            border-left: 2px solid #2ecc71;
            padding-left: 10px;
        }
        .val { color: #fff; font-weight: bold; margin-left: 4px; }

        /* --- 列表布局优化 --- */
        #file-container {
            background: transparent;
            border: none;
        }

        /* 统一桌面和手机的列比例：类型(40px) 文件名(1fr) 大小(70px) 操作(80px) */
        .list-header, .file-item { 
            display: grid; 
            grid-template-columns: 45px 1fr 75px 85px; 
            align-items: center;
            gap: 5px;
        }

        .list-header { 
            padding: 10px 5px; 
            color: rgba(46, 204, 113, 0.5); 
            font-size: 0.75rem;
            border-bottom: none;
            background: rgba(46, 204, 113, 0.05); /* 淡淡的底色区分表头 */
        }

        .file-item { 
            padding: 15px 5px; 
            transition: all 0.3s;
        }
        
        .file-item:hover {
            background: rgba(46, 204, 113, 0.12);
        }

        .file-icon { text-align: center; font-size: 1.1rem; color: #2ecc71; }
        
        .file-name { 
            color: #fff; 
            text-decoration: none; 
            font-weight: bold; 
            font-size: 0.9rem; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            white-space: nowrap;
            text-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
        }

        .file-size { 
            color: #2ecc71; 
            font-size: 0.75rem; 
            opacity: 0.8; 
            text-align: center;
        }
        
        .btn-download { 
            border: 1px solid #2ecc71;
            color: #2ecc71 !important;
            padding: 5px 0;
            border-radius: 3px;
            text-align: center;
            font-size: 0.7rem;
            text-decoration: none;
            background: rgba(46, 204, 113, 0.1);
        }

        .loading { padding: 60px 0; text-align: center; color: #2ecc71; font-size: 0.9rem; }

        /* 手机端细节微调 */
        @media (max-width: 600px) {
            .container { padding: 20px 8px; }
            .list-header, .file-item { 
                grid-template-columns: 35px 1fr 65px 75px; /* 进一步压缩列宽 */
                font-size: 0.8rem;
            }
            .file-name { font-size: 0.85rem; }
            .btn-download { font-size: 0.65rem; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fab fa-android"></i>
                <h1>hex 小站</h1>
                <div class="site-stats">
                    <div>已运行: <span id="runtime" class="val">-</span></div>
                    <div>响应: <span id="speed" class="val">-</span></div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div id="file-container">
                <div class="loading">正在接入核心数据库...</div>
            </div>
        </div>
    </div>

<script>
/* --- Matrix Background --- */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth, height = canvas.height = window.innerHeight;
const letters = "0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZ", fontSize = 16;
const columns = Math.floor(width / fontSize), drops = Array(columns).fill(1);

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)"; 
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = "#0F0"; 
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > height && Math.random() > 0.98) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 35);

/* --- Data & Runtime Logic --- */
const startMark = performance.now();
const CONFIG = {
    proxy: 'https://ghproxy.net/',
    createDate: '2025-12-23T00:00:00'
};

function showRuntime() {
    const diff = new Date().getTime() - new Date(CONFIG.createDate).getTime();
    if(diff < 0) { document.getElementById('runtime').innerText = "系统初始化中"; return; }
    const days = Math.floor(diff / (24 * 3600 * 1000));
    document.getElementById('runtime').innerText = days + " 天";
}
showRuntime();

async function loadData() {
    const container = document.getElementById('file-container');
    try {
        const res = await fetch(`./data.json?v=${Date.now()}`);
        const data = await res.json();
        const release = Array.isArray(data) ? data[0] : data;
        let assets = release.assets || [];

        if (assets.length === 0) {
            container.innerHTML = '<div class="loading">暂无可用数据</div>';
            return;
        }

        assets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        
        let html = `
            <div class="list-header">
                <div style="text-align:center">类型</div>
                <div>文件名</div>
                <div style="text-align:center">大小</div>
                <div style="text-align:center">操作</div>
            </div>`;
        
        assets.forEach(asset => {
            const size = (asset.size / 1048576).toFixed(1) + 'MB';
            const fastUrl = CONFIG.proxy + asset.browser_download_url;
            html += `
                <div class="file-item">
                    <div class="file-icon"><i class="fab fa-android"></i></div>
                    <a href="${fastUrl}" class="file-name">${asset.name}</a>
                    <div class="file-size">${size}</div>
                    <div class="file-op">
                        <a href="${fastUrl}" class="btn-download">下载</a>
                    </div>
                </div>`;
        });

        container.innerHTML = html;
        document.getElementById('speed').innerText = (performance.now() - startMark).toFixed(0) + 'ms';
    } catch (e) {
        container.innerHTML = '<div class="loading" style="color:#ff4d4d;">接入失败：请检查数据链路</div>';
    }
}
loadData();

window.addEventListener('resize', () => { 
    width = canvas.width = window.innerWidth; 
    height = canvas.height = window.innerHeight; 
});
</script>
</body>
</html>
