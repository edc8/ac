<script>
    // 1. 配置信息
    const OWNER = 'edc8';
    const REPO = 'ac';
    // 注意：如果是空仓库或没发布过 Release，这个接口会报 404
    const API_URL = `https://api.github.com/repos/${OWNER}/${REPO}/releases/latest`;

    // 2. 格式化文件大小
    function formatBytes(bytes, decimals = 2) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
    }

    // 3. 核心抓取逻辑
    async function fetchReleases() {
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const list = document.getElementById('release-list');

        try {
            const response = await fetch(API_URL, {
                headers: {
                    'Accept': 'application/vnd.github.v3+json'
                }
            });

            // 如果状态码不是 200，说明有问题
            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error("仓库还没有发布任何 Release 资源，请先去 GitHub 创建一个 Release。");
                } else if (response.status === 403) {
                    throw new Error("访问太频繁，被 GitHub 暂时限制了，请稍后再试。");
                } else {
                    throw new Error(`GitHub 返回了错误码: ${response.status}`);
                }
            }

            const data = await response.json();
            
            // 检查是否有附件
            if (!data.assets || data.assets.length === 0) {
                loading.innerText = `找到版本 ${data.tag_name}，但该版本没有上传任何文件。`;
                return;
            }

            loading.style.display = 'none';

            // 渲染列表
            data.assets.forEach(asset => {
                const fileExt = asset.name.split('.').pop().toUpperCase();
                const li = document.createElement('li');
                li.className = 'release-item';
                li.innerHTML = `
                    <div class="file-info">
                        <div class="file-icon">${fileExt}</div>
                        <div>
                            <a href="${asset.browser_download_url}" class="file-name" target="_blank">${asset.name}</a>
                            <div class="meta-info">
                                大小: ${formatBytes(asset.size)} | 下载次数: ${asset.download_count} | 更新于: ${new Date(asset.updated_at).toLocaleDateString()}
                            </div>
                        </div>
                    </div>
                    <a href="${asset.browser_download_url}" class="download-btn" target="_blank">立即下载</a>
                `;
                list.appendChild(li);
            });
        } catch (err) {
            console.error(err);
            loading.style.display = 'none';
            error.style.display = 'block';
            error.innerText = `加载失败：${err.message}`;
        }
    }

    window.onload = fetchReleases;
</script>
