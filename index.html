<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>hex 小站</title>
    <link rel="stylesheet" href="https://lf6-cdn-tos.bytecdntp.com/cdn/expire-1-M/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background-color: #000; 
            color: #2ecc71; 
            font-family: "Courier New", Courier, monospace; 
            line-height: 1.5; 
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 矩阵数字雨背景 */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
        }

        .container { 
            position: relative;
            max-width: 900px; 
            margin: 0 auto; 
            padding: 30px 15px; 
            z-index: 10;
        }

        header { background: transparent; margin-bottom: 40px; text-align: left; }
        .logo i { font-size: 2.5rem; color: #2ecc71; text-shadow: 0 0 15px #2ecc71; }
        .logo h1 { font-size: 1.8rem; font-weight: 700; color: #fff; margin: 10px 0; text-shadow: 0 0 10px #2ecc71; }
        .site-stats { font-size: 0.85rem; color: #2ecc71; display: flex; gap: 20px; opacity: 0.8; }
        .val { color: #fff; }

        /* 列表样式：无背景无格子 */
        .list-header { 
            display: grid; 
            grid-template-columns: 50px 1fr 100px 120px; 
            padding: 10px 0; 
            color: rgba(46, 204, 113, 0.5); 
            font-size: 0.8rem;
            border-bottom: 1px solid rgba(46, 204, 113, 0.3);
            margin-bottom: 10px;
        }

        .file-item { 
            display: grid; 
            grid-template-columns: 50px 1fr 100px 120px; 
            padding: 18px 0; 
            border-bottom: 1px solid rgba(46, 204, 113, 0.1); 
            align-items: center; 
            transition: all 0.3s;
        }
        
        .file-item:hover {
            background: rgba(46, 204, 113, 0.08);
            padding-left: 8px;
        }

        .file-icon { font-size: 1.4rem; color: #2ecc71; }
        .file-name { color: #fff; text-decoration: none; font-weight: bold; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .file-size { color: #2ecc71; font-size: 0.85rem; opacity: 0.7; }
        
        /* 下载按钮样式 */
        .btn-download { 
            border: 1px solid #2ecc71;
            color: #2ecc71 !important;
            padding: 6px 0;
            border-radius: 4px;
            text-align: center;
            font-size: 0.8rem;
            text-decoration: none;
            background: rgba(46, 204, 113, 0.1);
            transition: all 0.3s;
        }
        .btn-download:hover {
            background: #2ecc71;
            color: #000 !important;
            box-shadow: 0 0 15px #2ecc71;
        }

        .loading { padding: 100px 0; text-align: center; color: #2ecc71; }

        @media (max-width: 600px) {
            .list-header { display: none; }
            .file-item { grid-template-columns: 40px 1fr 90px; }
            .hide-mob { display: none; }
            .file-name { font-size: 0.95rem; }
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>

    <div class="container">
        <header>
            <div class="logo">
                <i class="fab fa-android"></i>
                <h1></h1>
                <div class="site-stats">
                    <div>小破站已运行时间: <span id="runtime" class="val">-</span></div>
                    <div>响应速度: <span id="speed" class="val">-</span></div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div id="file-container">
                <div class="loading">正在接入核心数据库...</div>
            </div>
        </div>
    </div>

<script>
/* --- Matrix Background --- */
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth, height = canvas.height = window.innerHeight;
const letters = "0101010101ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%", fontSize = 16;
const columns = Math.floor(width / fontSize), drops = Array(columns).fill(1);

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.08)"; 
    ctx.fillRect(0, 0, width, height);
    ctx.fillStyle = "#0F0"; 
    ctx.font = fontSize + "px monospace";
    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > height && Math.random() > 0.98) drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 35);
window.addEventListener('resize', () => { 
    width = canvas.width = window.innerWidth; 
    height = canvas.height = window.innerHeight; 
});

/* --- Data & Runtime Logic --- */
const startMark = performance.now();
const CONFIG = {
    proxy: 'https://ghproxy.net/',
    createDate: '2025-12-23T00:00:00' // 建站日期
};

function showRuntime() {
    const diff = new Date().getTime() - new Date(CONFIG.createDate).getTime();
    if(diff < 0) { document.getElementById('runtime').innerText = "系统初始化中"; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    document.getElementById('runtime').innerText = `${d}天 ${h}时 ${m}分 ${s}秒`;
}
setInterval(showRuntime, 1000);

async function loadData() {
    const container = document.getElementById('file-container');
    try {
        const res = await fetch(`./data.json?v=${Date.now()}`);
        const data = await res.json();
        const release = Array.isArray(data) ? data[0] : data;
        let assets = release.assets || [];

        if (assets.length === 0) {
            container.innerHTML = '<div class="loading">暂无可用数据</div>';
            return;
        }

        assets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        container.innerHTML = `
            <div class="list-header">
                <div>类型</div><div>文件名</div><div class="hide-mob">大小</div><div>操作</div>
            </div>`;
        
        assets.forEach(asset => {
            const size = (asset.size / 1048576).toFixed(1) + 'MB';
            const fastUrl = CONFIG.proxy + asset.browser_download_url;
            container.insertAdjacentHTML('beforeend', `
                <div class="file-item">
                    <div class="file-icon"><i class="fab fa-android"></i></div>
                    <a href="${fastUrl}" class="file-name">${asset.name}</a>
                    <div class="file-size hide-mob">${size}</div>
                    <div class="file-op">
                        <a href="${fastUrl}" class="btn-download">极速下载</a>
                    </div>
                </div>`);
        });

        document.getElementById('speed').innerText = (performance.now() - startMark).toFixed(0) + 'ms';
    } catch (e) {
        container.innerHTML = '<div class="loading" style="color:#ff4d4d;">接入失败：请检查数据链路</div>';
    }
}
loadData();
</script>
</body>
</html>
